<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deymians - XatSpace</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <main class="space-card">
      <!-- Portada Superior con Filtro Gradiente -->
      <div class="card-cover">
        <div class="cover-overlay"></div>
        <div class="live-pill">
          <span class="live-dot"></span>
          <span>Online</span>
        </div>
      </div>

      <!-- Contenedor Principal de la Tarjeta -->
      <div class="card-content">
        
        <!-- Foto en Squircle -->
        <div class="avatar-box">
          <img src="/DeymiansPicProfile_13.png" alt="Deymians" class="avatar-squircle" />
        </div>

        <!-- Información y Detalles -->
        <div class="profile-details">
          <div class="identity-header">
            <h1 class="username">Deymians</h1>
            <div class="badges-row">
              <span class="id-pill">#30003000</span>
              <span class="country-pill">
                <img src="/ve.png" alt="Venezuela" class="flag-mini" />
                <span>VE</span>
              </span>
            </div>
          </div>

          <!-- Acción Principal: Mi esposa -->
          <div class="action-area">
            <a href="https://xat.me/Quevezorra" class="btn-beloved" target="_blank" rel="noopener">
              <i class="fa-solid fa-heart beat-icon"></i>
              <span>Mi esposa</span>
            </a>
          </div>
        </div>

      </div>

      <!-- Créditos / Watermark Minimalista -->
      <footer class="card-footer">
        <p>XatSpace made by <strong>Deymians</strong></p>
      </footer>
    </main>

  </body>
</html>
